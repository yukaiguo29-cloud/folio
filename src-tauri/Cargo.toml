[package]
name = "folio"
version = "0.1.1"
description = "知间 · Folio — Offline document reader"
authors = ["Folio"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
close-smoke-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

